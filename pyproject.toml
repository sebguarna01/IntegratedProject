[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "activenav"
version = "0.1.0"
description = "Active Visual Navigation and Autonomous Docking (camera-only) in MuJoCo"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "mujoco", "pyyaml", "matplotlib", "opencv-contrib-python"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
